version: "3.8"

services:
  skill-share_db:
    image: mariadb
    container_name: skill-share_db
    restart: unless-stopped
    ports:
      - "3083:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - skill-share_db:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d
    networks:
      - skill-share_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: skill-share_phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: skill-share_db
      PMA_PORT: ${PMA_PORT}
    depends_on:
      - skill-share_db
    networks:
      - skill-share_network

  mailpit:
    image: axllent/mailpit
    container_name: skill-share_mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    networks:
      - skill-share_network

volumes:
  skill-share_db:

networks:
  skill-share_network:
    external: true
    name: skill-share_network